name: BSE Earnings Ingestion

# Twice-daily automation:
#   * 16:00 UTC = 21:30 IST — catches the post-market-close surge of result filings.
#   * 03:00 UTC = 08:30 IST — sweeps anything filed overnight / late night.
# With INGEST_DAYS=2 the two runs overlap, so nothing is missed (dedup handles re-sees).
# Also runnable on demand via the "Run workflow" button (days / pdf_limit inputs).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to scan (INGEST_DAYS)"
        required: false
        default: "2"
      pdf_limit:
        description: "Max PDFs to read this run (INGEST_LIMIT)"
        required: false
        default: "40"
  schedule:
    - cron: "0 16 * * *" # 21:30 IST — evening results surge
    - cron: "0 3 * * *" # 08:30 IST — overnight sweep

# Never let two ingestion runs overlap (they'd fight over the same stubs).
concurrency:
  group: bse-earnings-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 40 PDFs/run x ~34s each ≈ 23 min; 45 gives headroom for slow PDFs / retries.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion
        working-directory: ingestion
        env:
          # --- Cloudflare D1 (absent => safe DRY-RUN, no writes) ---
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # --- Firecrawl (PDF -> markdown) ---
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # --- LLM extraction (Claude on Bedrock by default) ---
          LLM_PROVIDER: claude
          CLAUDE_BEDROCK_API_KEY: ${{ secrets.CLAUDE_BEDROCK_API_KEY }}
          CLAUDE_BEDROCK_REGION: ${{ secrets.CLAUDE_BEDROCK_REGION }}
          CLAUDE_BEDROCK_MODEL_ID: ${{ secrets.CLAUDE_BEDROCK_MODEL_ID }}
          # --- OpenAI (only used if you set LLM_PROVIDER=openai) ---
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # --- Optional proxy fallback ---
          SCRAPEDO_API_KEY: ${{ secrets.SCRAPEDO_API_KEY }}
          # --- Window / cost caps (dispatch inputs override the schedule defaults) ---
          INGEST_DAYS: ${{ github.event.inputs.days || '2' }}
          INGEST_LIMIT: ${{ github.event.inputs.pdf_limit || '40' }}
          INGEST_MAX_PAGES: ${{ vars.INGEST_MAX_PAGES || '60' }}
        run: python main.py
